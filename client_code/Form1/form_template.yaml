          \ need to send the link to yourself is to click on 'send2me'", font_size: null,
        font: '', spacing_above: small, icon_align: left, spacing_below: small, italic: false,
        background: '', bold: false, underline: false, icon: ''}
      name: label_6
      layout_properties: {grid_position: 'ELUHGX,MUAGXD'}
  - type: Spacer
    properties: {height: 32}
    name: spacer_2
    layout_properties: {grid_position: 'BVPLON,XBOHCZ'}
- type: FlowPanel
  properties: {}
  name: navbar_links
  layout_properties: {slot: nav-right}
- type: Label
  properties: {role: headline, align: center, tooltip: '', border: '', foreground: '',
    visible: true, text: send2me, font_size: null, font: '', spacing_above: small,
    icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
    underline: false, icon: 'data:image/png;base64,'}
  name: label_1
  layout_properties: {slot: title}
