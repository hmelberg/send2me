components:
- components:
  - components:
    - components:
      - layout_properties: {}
        name: image_brand
        properties: {display_mode: shrink_to_fit, height: 22,
          source: '_/theme/iconfinder_telegram_3246742.png'}
        type: Image
      - components: []
        layout_properties: {}
        name: link_brand
        properties: {role: brand-name, text: send2me.app,
          url: 'https://send2me.app/'}
        type: Link
      layout_properties: {}
      name: brand_panel
      properties: {role: header-brand}
      type: FlowPanel
    - layout_properties: {}
      name: label_title
      properties: {role: headline, text: My links}
      type: Label
    - components:
      - event_bindings: {change: filter_changed, pressed_enter: filter_changed}
        layout_properties: {}
        name: text_box_search
        properties: {placeholder: 'Search title, tags, notes ...', role: toolbar-search}
        type: TextBox
      - components: []
        event_bindings: {click: link_clear_click}
        layout_properties: {}
        name: link_clear
        properties: {icon: 'fa:times', role: toolbar-clear, text: '',
          tooltip: 'Clear search and tag filter', url: '', visible: false}
        type: Link
      - components:
        - layout_properties: {}
          name: label_tag_icon
          properties: {icon: 'fa:tag', role: header-tag-icon, text: '',
            tooltip: 'Tag added to every new link you save'}
          type: Label
        - event_bindings: {lost_focus: current_tag_saved, pressed_enter: current_tag_saved}
          layout_properties: {}
          name: text_box_current_tag
          properties: {placeholder: 'Set current tag', role: header-tag-input,
            tooltip: 'Tag added to every new link you save'}
          type: TextBox
        layout_properties: {}
        name: tag_panel
        properties: {role: header-tag, visible: false}
        type: FlowPanel
      - components: []
        event_bindings: {click: link_selected_click}
        layout_properties: {}
        name: link_selected
        properties: {role: toolbar-selected, text: '', tooltip: 'Clear selection',
          url: '', visible: false}
        type: Link
      - components: []
        event_bindings: {click: link_export_click}
        layout_properties: {}
        name: link_export
        properties: {icon: 'fa:download', role: header-icon, tooltip: Export CSV,
          url: '', visible: false}
        type: Link
      - components: []
        event_bindings: {click: link_settings_click}
        layout_properties: {}
        name: link_settings
        properties: {icon: 'fa:cog', role: header-icon, tooltip: Settings, url: '',
          visible: false}
        type: Link
      layout_properties: {}
      name: actions_panel
      properties: {align: right, role: header-actions, visible: false}
      type: FlowPanel
    layout_properties: {}
    name: header_panel
    properties: {role: page-header}
    type: FlowPanel
  - layout_properties: {}
    name: label_status
    properties: {role: status-line, text: '', visible: false}
    type: Label
  - components:
    - event_bindings: {pressed_enter: text_box_key_pressed_enter}
      layout_properties: {}
      name: text_box_key
      properties: {placeholder: 'paste your key from the email', width: 320}
      type: TextBox
    - event_bindings: {click: button_open_click}
      layout_properties: {}
      name: button_open
      properties: {role: primary-color, text: Open my links}
      type: Button
    layout_properties: {}
    name: login_panel
    properties: {role: login-panel}
    type: FlowPanel
  - components:
    - components: []
      event_bindings: {click: sort_by_stars}
      layout_properties: {}
      name: link_head_stars
      properties: {role: head-cell, text: "★", tooltip: Sort by stars, url: ''}
      type: Link
    - event_bindings: {change: select_all_changed}
      layout_properties: {}
      name: check_box_all
      properties: {role: row-check, text: '',
        tooltip: 'Select or clear every link that matches the filter'}
      type: CheckBox
    - components: []
      event_bindings: {click: sort_by_date}
      layout_properties: {}
      name: link_head_date
      properties: {role: head-cell, text: Date, tooltip: Sort by date, url: ''}
      type: Link
    - components: []
      event_bindings: {click: sort_by_title}
      layout_properties: {}
      name: link_head_title
      properties: {role: head-cell, text: Title, tooltip: Sort by title, url: ''}
      type: Link
    - layout_properties: {}
      name: label_head_end
      properties: {role: head-cell, text: ''}
      type: Label
    - event_bindings: {change: filter_changed}
      layout_properties: {}
      name: drop_down_tag
      properties: {role: head-select}
      type: DropDown
    - layout_properties: {}
      name: label_head_note
      properties: {role: head-cell, text: Note}
      type: Label
    layout_properties: {}
    name: head_panel
    properties: {role: link-head, visible: false}
    type: FlowPanel
  - layout_properties: {}
    name: repeating_panel_links
    properties: {item_template: LinkRow, role: link-list}
    type: RepeatingPanel
  - components:
    - layout_properties: {}
      name: label_shown
      properties: {role: footer-count, text: ''}
      type: Label
    - components: []
      event_bindings: {click: link_more_click}
      layout_properties: {}
      name: link_more
      properties: {role: footer-more, text: Show more, url: ''}
      type: Link
    layout_properties: {}
    name: footer_panel
    properties: {role: list-footer, visible: false}
    type: FlowPanel
  - layout_properties: {}
    name: label_empty
    properties: {role: empty-state, text: '', visible: false}
    type: Label
  layout_properties: {slot: default}
  name: content_panel
  properties: {role: wide-card}
  type: LinearPanel
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
