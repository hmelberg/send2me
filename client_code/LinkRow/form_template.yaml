components:
- components:
  - components: []
    event_bindings: {click: link_star1_click}
    layout_properties: {}
    name: link_star1
    properties: {role: star, text: "★", tooltip: 'One star', url: ''}
    type: Link
  - components: []
    event_bindings: {click: link_star2_click}
    layout_properties: {}
    name: link_star2
    properties: {role: star, text: "★", tooltip: 'Two stars', url: ''}
    type: Link
  - components: []
    event_bindings: {click: link_star3_click}
    layout_properties: {}
    name: link_star3
    properties: {role: star, text: "★", tooltip: 'Three stars', url: ''}
    type: Link
  layout_properties: {}
  name: stars_panel
  properties: {role: stars}
  type: FlowPanel
- event_bindings: {change: check_box_select_change}
  layout_properties: {}
  name: check_box_select
  properties: {role: row-check, text: '', tooltip: 'Select for export'}
  type: CheckBox
- layout_properties: {}
  name: label_date
  properties: {role: row-date, text: ''}
  type: Label
- components: []
  layout_properties: {}
  name: link_title
  properties: {role: row-title, text: '', url: ''}
  type: Link
- components: []
  event_bindings: {click: link_delete_click}
  layout_properties: {}
  name: link_delete
  properties: {role: row-delete, text: "✕", tooltip: Delete this link, url: ''}
  type: Link
- event_bindings: {lost_focus: text_box_tags_lost_focus, pressed_enter: text_box_tags_pressed_enter}
  layout_properties: {}
  name: text_box_tags
  properties: {placeholder: tags, role: row-input}
  type: TextBox
- event_bindings: {lost_focus: text_box_note_lost_focus, pressed_enter: text_box_note_pressed_enter}
  layout_properties: {}
  name: text_box_note
  properties: {placeholder: note, role: row-note}
  type: TextBox
- components: []
  event_bindings: {click: link_note_toggle_click}
  layout_properties: {}
  name: link_note_toggle
  properties: {icon: 'fa:comment-o', role: row-note-toggle, text: '',
    tooltip: 'Show or hide the note', url: ''}
  type: Link
container:
  properties: {role: link-row}
  type: FlowPanel
is_package: true
