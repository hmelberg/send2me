is_package: true
container:
  type: HtmlTemplate
  properties: {html: '@theme:standard-page.html'}
components:
- type: ColumnPanel
  properties: {col_widths: '{}'}
  name: content_panel
  layout_properties: {slot: default}
  components:
  - type: Label
    properties: {role: null, align: center, tooltip: '', border: '', foreground: '',
      visible: true, text: 'A one-click solution to e-mail yourself the link of a
        page.  One click, no delay, no typing.', font_size: null, font: '', spacing_above: small,
      icon_align: left, spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: label_2
    layout_properties: {grid_position: 'MSROSJ,FCKDOH'}
  - type: Label
    properties: {role: null, align: center, tooltip: '', border: '', foreground: '',
      visible: true, text: 'How to install it?

        ', font_size: null, font: '', spacing_above: small, icon_align: left, spacing_below: small,
      italic: false, background: '', bold: true, underline: false, icon: ''}
    name: label_3
    layout_properties: {grid_position: 'SEFWHF,HUJSAA'}
  - type: Label
    properties: {role: null, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: 1. Write your email in the box below, font_size: null,
      font: '', spacing_above: small, icon_align: left, spacing_below: small, italic: false,
      background: '', bold: false, underline: false, icon: ''}
    name: label_4
    layout_properties: {grid_position: 'NTAHZM,ACJQWV'}
  - type: TextBox
    properties: {}
    name: email
    layout_properties: {grid_position: 'NTAHZM,CPFWME'}
    event_bindings: {pressed_enter: email_pressed_enter}
  - type: Label
    properties: {role: null, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: 2. Click to generate the your unique link, font_size: null,
      font: '', spacing_above: small, icon_align: left, spacing_below: small, italic: false,
      background: '', bold: false, underline: false, icon: ''}
    name: label_7
    layout_properties: {grid_position: 'WOMCRD,JRUEJZ'}
  - type: Button
    properties: {role: null, align: center, tooltip: '', border: '', enabled: true,
      foreground: '', visible: true, text: Create link, font_size: null, font: '',
      spacing_above: small, icon_align: left, spacing_below: small, italic: false,
      background: '', bold: false, underline: false, icon: ''}
    name: create_link
    layout_properties: {grid_position: 'WOMCRD,VNRWOD'}
    event_bindings: {click: create_link_click}
  - type: Label
    properties: {role: null, align: left, tooltip: '', border: '', foreground: '',
      visible: true, text: 3. Drag and drop the 'send2me' link on the top line of your browser,
      font_size: null, font: '', spacing_above: small, icon_align: left, spacing_below: small,
      italic: false, background: '', bold: false, underline: false, icon: ''}
    name: label_5
    layout_properties: {grid_position: 'RDWUIW,OETCOC'}
  - type: Link
    properties: {role: null, url: '', align: center, tooltip: Drag and drop me on the list of bookmarks,
      border: '', foreground: '', visible: false, text: Send2me, font_size: null,
      wrap_on: mobile, font: '', col_spacing: medium, spacing_above: small, icon_align: left,
      col_widths: '', spacing_below: small, italic: false, background: '', bold: false,
      underline: false, icon: ''}
    name: link
    layout_properties: {grid_position: 'RDWUIW,GTPSKH'}
    event_bindings: {click: link_click}
  - type: ColumnPanel
    properties: {col_widths: '{}'}
    name: column_panel_1
    layout_properties: {grid_position: 'EAZSBG,CNJGXB'}
    components:
    - type: Label
      properties: {role: null, align: center, tooltip: '', border: '', foreground: '',
        visible: true, text: "That is it!\n\n You can now go to a page and all you\
          \ need to send the link to yourself is to click on 'send2me'", font_size: null,
        font: '', spacing_above: small, icon_align: left, spacing_below: small, italic: false,
        background: '', bold: false, underline: false, icon: ''}
      name: label_6
      layout_properties: {grid_position: 'ELUHGX,MUAGXD'}
- type: FlowPanel
  properties: {}
  name: navbar_links
  layout_properties: {slot: nav-right}
- type: Label
  properties: {role: null, align: left, tooltip: '', border: '', foreground: '', visible: true,
    text: Send2me.link, font_size: null, font: '', spacing_above: small, icon_align: left,
    spacing_below: small, italic: false, background: '', bold: false, underline: false,
    icon: ''}
  name: label_1
  layout_properties: {slot: title}
