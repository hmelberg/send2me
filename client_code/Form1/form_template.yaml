  - type: Spacer
    properties: {height: 16}
    name: spacer_3
    layout_properties: {grid_position: 'BVPLON,ILVJEH QABXJO,CFDIVA'}
  - type: Label
    properties: {role: subheading, align: center, tooltip: '', border: '', foreground: '',
      visible: true, text: 'How to install it?

        ', font_size: null, font: '', spacing_above: small, icon_align: left, spacing_below: small,
      italic: false, background: '', bold: true, underline: false, icon: ''}
    name: label_3
    layout_properties: {grid_position: 'BVPLON,ILVJEH SEFWHF,HUJSAA'}
  - type: Label
